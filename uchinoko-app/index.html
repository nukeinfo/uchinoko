<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>うちの子</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body { background-color: #f5f5dc; font-family: 'Hiragino Maru Gothic ProN', sans-serif; padding: 20px; color: #333; text-align: center; }
        h1 { font-size: 28px; margin-top: 20px; color: #556b2f; text-shadow: 1px 1px 2px #fff; }
        .subtitle { font-size: 14px; margin-bottom: 20px; color: #666; }
        .lang-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .lang-btn { background: #fff; border: 2px solid #556b2f; border-radius: 15px; padding: 5px 12px; font-size: 13px; cursor: pointer; opacity: 0.6; font-weight: bold; }
        .lang-btn.active { opacity: 1; background: #adff2f; }

        /* ID入力画面 */
        .id-box { background: #fff; border: 2px solid #556b2f; border-radius: 15px; padding: 25px 20px; max-width: 380px; margin: 0 auto 20px; box-shadow: 0 4px 0 #ccd4bb; }
        .id-box h2 { font-size: 18px; color: #556b2f; margin-bottom: 10px; }
        .id-box p { font-size: 13px; color: #666; margin-bottom: 15px; line-height: 1.6; }
        .id-input { width: 100%; padding: 15px; font-size: 20px; border: 2px solid #556b2f; border-radius: 10px; box-sizing: border-box; text-align: center; letter-spacing: 2px; -webkit-appearance: none; margin-bottom: 10px; }
        .id-submit-btn { background: #adff2f; border: 2px solid #556b2f; border-radius: 10px; padding: 15px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 3px 0 #ccd4bb; width: 100%; -webkit-appearance: none; }
        .id-hint { font-size: 12px; color: #888; margin-top: 15px; line-height: 1.6; }

        /* メイン画面 */
        .pet-selector { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .pet-option { background: #fff; border: 2px solid #556b2f; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 15px; box-shadow: 0 3px 0 #ccd4bb; transition: 0.2s; opacity: 0.6; }
        .pet-option.active { opacity: 1; border: 3px solid #556b2f; transform: translateY(2px); box-shadow: 0 1px 0 #ccd4bb; }
        .add-pet-area { margin-bottom: 25px; }
        .add-pet-row { display: flex; gap: 8px; max-width: 400px; margin: 0 auto 8px; }
        .add-pet-row input { flex: 1; padding: 10px; border: 2px solid #556b2f; border-radius: 10px; font-size: 15px; }
        .add-pet-row select { padding: 10px; border: 2px solid #556b2f; border-radius: 10px; font-size: 15px; background: #fff; }
        .add-btn { background: #adff2f; border: 2px solid #556b2f; border-radius: 10px; padding: 10px 15px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 2px 0 #ccd4bb; }
        .del-pet-btn { background: #fff; border: 1px solid #ccc; border-radius: 8px; font-size: 11px; padding: 2px 6px; cursor: pointer; color: #999; margin-left: 4px; vertical-align: middle; }
        .menu-container { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 400px; margin: auto; }
        .menu-item { background: #fff; border: 2px solid #556b2f; border-radius: 15px; padding: 20px; text-decoration: none; color: #000; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #ccd4bb; transition: 0.2s; }
        .menu-item:active { transform: translateY(4px); box-shadow: none; }
        .icon { font-size: 24px; margin-right: 10px; }
        .footer-deco { margin-top: 40px; font-size: 20px; color: #bc8f8f; opacity: 0.6; }
        .no-pet-msg { color: #888; font-size: 14px; margin: 20px 0; }
        .section-label { font-size: 12px; color: #888; margin-bottom: 6px; }
        .family-id-bar { background: #f0f0f0; border-radius: 10px; padding: 8px 15px; max-width: 400px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #555; }
        .change-id-btn { background: none; border: 1px solid #ccc; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #888; }
        .loading-msg { color: #888; font-size: 14px; margin: 20px 0; }
    </style>
</head>
<body>

    <!-- 言語選択（両画面共通） -->
    <div class="lang-selector">
        <button class="lang-btn" onclick="setLang('ja')">🇯🇵 日本語</button>
        <button class="lang-btn" onclick="setLang('en')">🇺🇸 English</button>
        <button class="lang-btn" onclick="setLang('es')">🇪🇸 Español</button>
    </div>

    <h1>🐾 <span id="t-title"></span></h1>
    <p class="subtitle" id="t-subtitle"></p>

    <!-- ID入力画面 -->
    <div id="idScreen" style="display:none;">
        <div class="id-box">
            <h2 id="t-id-title"></h2>
            <p id="t-id-desc"></p>
            <input type="text" id="familyIdInput" class="id-input" maxlength="20"
                autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
            <button class="id-submit-btn" onclick="submitFamilyId()" id="t-id-btn"></button>
            <p class="id-hint" id="t-id-hint"></p>
        </div>
    </div>

    <!-- メイン画面 -->
    <div id="mainScreen" style="display:none;">
        <div class="family-id-bar">
            <span id="familyIdDisplay"></span>
            <button class="change-id-btn" onclick="changeId()" id="t-change-id"></button>
        </div>
        <div class="section-label" id="t-select-label"></div>
        <div class="pet-selector" id="petSelector"></div>
        <div class="add-pet-area">
            <div class="section-label" id="t-add-label"></div>
            <div class="add-pet-row">
                <input type="text" id="newPetName" maxlength="10">
                <select id="newPetType">
                    <option value="dog">🐶</option>
                    <option value="cat">🐱</option>
                </select>
                <button class="add-btn" onclick="addPet()" id="t-add-btn"></button>
            </div>
        </div>
        <div id="menuArea">
            <p class="no-pet-msg" id="t-no-pet"></p>
        </div>
    </div>

    <div class="footer-deco">🐾 🐾 🐾</div>
    <div style="text-align:center; margin-top:20px; padding-bottom:20px;">
        <span style="display:block; color:#888; font-size:13px; font-weight:bold;">© T.K.C.</span>
        <small style="color:#666; font-size:10px; letter-spacing:0.5px;">True Kind Care for all the loved ones</small>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAOevKlIPTEu1pgZhyf_a-I2US5KbZQi2c",
        authDomain: "uchinoko-58fc7.firebaseapp.com",
        projectId: "uchinoko-58fc7",
        storageBucket: "uchinoko-58fc7.firebasestorage.app",
        messagingSenderId: "47451202211",
        appId: "1:47451202211:web:f205f797c3560f5c7c9516"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const FAMILY_ID_KEY = 'uchinoko_family_id';
    const SELECTED_KEY = 'uchinoko_selected_pet';
    const LANG_KEY = 'uchinoko_lang';

    const i18n = {
        ja: {
            title: 'うちの子', subtitle: 'だいじな家族の、毎日のきろく',
            idTitle: 'ファミリーIDを入力', 
            idDesc: 'ご家族で共有するIDです。\n初めての方は新しいIDを決めてください。\n（英数字・4文字以上）',
            idBtn: 'スタート',
            idHint: '💡 ご家族全員が同じIDを入力すると\nデータを共有できます\n💡 スマホを変えた時も同じIDでOK',
            idDisplay: (id) => `🔑 ID: ${id}`,
            changeId: 'IDを変更',
            selectLabel: 'ペットを選んでください',
            addLabel: 'ペットを追加する',
            addBtn: '追加', noPet: 'ペットを追加または選択してください',
            namePlaceholder: '名前（例：ポチ）',
            maxPets: '登録できるペットは3匹までです',
            sameName: '同じ名前のペットが既にいます',
            nameRequired: '名前を入力してください',
            idTooShort: 'IDは4文字以上で入力してください',
            idInvalid: 'IDは英数字のみ使えます',
            confirmChange: 'IDを変更するとこの端末ではデータが見えなくなります。よろしいですか？',
            deleteConfirm: (name) => `「${name}」を削除しますか？\n※記録データは残ります`,
            loading: '読み込み中...',
            menu: { diary: '日記をつける', symptoms: '症状をふりかえる', album: '写真動画アルバム', blood: '血液検査の結果をみる' }
        },
        en: {
            title: 'My Little One', subtitle: 'Daily records for your beloved family',
            idTitle: 'Enter Family ID',
            idDesc: 'This ID is shared with your family.\nNew users: create your own ID.\n(Letters & numbers, 4+ characters)',
            idBtn: 'Start',
            idHint: '💡 All family members enter the same ID\nto share data\n💡 Use the same ID on a new phone',
            idDisplay: (id) => `🔑 ID: ${id}`,
            changeId: 'Change ID',
            selectLabel: 'Select your pet',
            addLabel: 'Add a pet',
            addBtn: 'Add', noPet: 'Please add or select a pet',
            namePlaceholder: 'Name (e.g. Bella)',
            maxPets: 'You can register up to 3 pets',
            sameName: 'A pet with the same name already exists',
            nameRequired: 'Please enter a name',
            idTooShort: 'ID must be at least 4 characters',
            idInvalid: 'ID can only contain letters and numbers',
            confirmChange: 'Changing ID will hide your data on this device. Continue?',
            deleteConfirm: (name) => `Delete "${name}"?\n※Your records will be kept`,
            loading: 'Loading...',
            menu: { diary: 'Write a diary', symptoms: 'Review symptoms', album: 'Photo & Video album', blood: 'Blood test results' }
        },
        es: {
            title: 'Mi Peque', subtitle: 'Registros diarios de tu familia querida',
            idTitle: 'Ingresa el ID familiar',
            idDesc: 'Este ID se comparte con tu familia.\nNuevos usuarios: crea tu propio ID.\n(Letras y números, 4+ caracteres)',
            idBtn: 'Comenzar',
            idHint: '💡 Todos los familiares ingresan el mismo ID\npara compartir datos\n💡 Usa el mismo ID en un teléfono nuevo',
            idDisplay: (id) => `🔑 ID: ${id}`,
            changeId: 'Cambiar ID',
            selectLabel: 'Selecciona tu mascota',
            addLabel: 'Agregar mascota',
            addBtn: 'Agregar', noPet: 'Por favor agrega o selecciona una mascota',
            namePlaceholder: 'Nombre (ej: Luna)',
            maxPets: 'Puedes registrar hasta 3 mascotas',
            sameName: 'Ya existe una mascota con el mismo nombre',
            nameRequired: 'Por favor ingresa un nombre',
            idTooShort: 'El ID debe tener al menos 4 caracteres',
            idInvalid: 'El ID solo puede contener letras y números',
            confirmChange: 'Cambiar el ID ocultará tus datos en este dispositivo. ¿Continuar?',
            deleteConfirm: (name) => `¿Eliminar "${name}"?\n※Los registros se conservarán`,
            loading: 'Cargando...',
            menu: { diary: 'Escribir diario', symptoms: 'Revisar síntomas', album: 'Álbum de fotos y videos', blood: 'Resultados de análisis de sangre' }
        }
    };

    function getLang() { return localStorage.getItem(LANG_KEY) || 'ja'; }

    window.setLang = function(lang) {
        localStorage.setItem(LANG_KEY, lang);
        location.reload();
    };

    function applyLang() {
        const lang = getLang();
        const t = i18n[lang];
        document.documentElement.lang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const idx = { ja: 0, en: 1, es: 2 }[lang];
        document.querySelectorAll('.lang-btn')[idx].classList.add('active');
        document.getElementById('t-title').innerText = t.title;
        document.getElementById('t-subtitle').innerText = t.subtitle;
        document.getElementById('t-id-title').innerText = t.idTitle;
        document.getElementById('t-id-desc').innerText = t.idDesc;
        document.getElementById('t-id-btn').innerText = t.idBtn;
        document.getElementById('t-id-hint').innerText = t.idHint;
        document.getElementById('t-select-label').innerText = t.selectLabel;
        document.getElementById('t-add-label').innerText = t.addLabel;
        document.getElementById('t-add-btn').innerText = t.addBtn;
        document.getElementById('t-no-pet').innerText = t.noPet;
        document.getElementById('t-change-id').innerText = t.changeId;
        document.getElementById('newPetName').placeholder = t.namePlaceholder;
    }

    // ファミリーIDチェック
    const familyId = localStorage.getItem(FAMILY_ID_KEY);
    applyLang();

    if (familyId) {
        showMainScreen(familyId);
    } else {
        document.getElementById('idScreen').style.display = 'block';
    }

    // ID送信
    window.submitFamilyId = async function() {
        const lang = getLang();
        const t = i18n[lang];
        const input = document.getElementById('familyIdInput').value.trim().toLowerCase();
        if (input.length < 4) return alert(t.idTooShort);
        if (!/^[a-z0-9]+$/.test(input)) return alert(t.idInvalid);
        localStorage.setItem(FAMILY_ID_KEY, input);
        await showMainScreen(input);
    };

    // Enterキーでも送信
    document.getElementById('familyIdInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') window.submitFamilyId();
    });

    // ID変更
    window.changeId = function() {
        const lang = getLang();
        const t = i18n[lang];
        if (!confirm(t.confirmChange)) return;
        localStorage.removeItem(FAMILY_ID_KEY);
        localStorage.removeItem(SELECTED_KEY);
        location.reload();
    };

    // メイン画面表示
    async function showMainScreen(fid) {
        document.getElementById('idScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        const lang = getLang();
        const t = i18n[lang];
        document.getElementById('familyIdDisplay').innerText = t.idDisplay(fid);
        document.getElementById('menuArea').innerHTML = `<p class="loading-msg">${t.loading}</p>`;
        await loadPetsAndRender(fid);
    }

    // Firebaseからペット読み込み
    async function loadPetsAndRender(fid) {
        try {
            const snap = await getDoc(doc(db, 'families', fid));
            const pets = snap.exists() ? (snap.data().pets || []) : [];
            // localStorageにも保存（他ページで使用）
            localStorage.setItem('uchinoko_pets', JSON.stringify(pets));
            renderAll(pets);
        } catch(e) {
            console.error(e);
            renderAll([]);
        }
    }

    // Firebaseにペット保存
    async function savePetsToFirebase(pets) {
        const fid = localStorage.getItem(FAMILY_ID_KEY);
        await setDoc(doc(db, 'families', fid), { pets });
        localStorage.setItem('uchinoko_pets', JSON.stringify(pets));
    }

    // ペット追加
    window.addPet = async function() {
        const lang = getLang();
        const t = i18n[lang];
        const name = document.getElementById('newPetName').value.trim();
        const type = document.getElementById('newPetType').value;
        if (!name) return alert(t.nameRequired);
        const snap = await getDoc(doc(db, 'families', localStorage.getItem(FAMILY_ID_KEY)));
        const pets = snap.exists() ? (snap.data().pets || []) : [];
        if (pets.length >= 3) return alert(t.maxPets);
        if (pets.find(p => p.name === name)) return alert(t.sameName);
        const newPet = { id: 'pet_' + Date.now(), name, type };
        pets.push(newPet);
        await savePetsToFirebase(pets);
        localStorage.setItem(SELECTED_KEY, newPet.id);
        document.getElementById('newPetName').value = '';
        renderAll(pets);
    };

    // ペット削除
    window.deletePet = async function(petId) {
        const lang = getLang();
        const t = i18n[lang];
        const snap = await getDoc(doc(db, 'families', localStorage.getItem(FAMILY_ID_KEY)));
        const pets = snap.exists() ? (snap.data().pets || []) : [];
        const pet = pets.find(p => p.id === petId);
        if (!pet) return;
        if (!confirm(t.deleteConfirm(pet.name))) return;
        const newPets = pets.filter(p => p.id !== petId);
        await savePetsToFirebase(newPets);
        const selectedId = localStorage.getItem(SELECTED_KEY);
        if (selectedId === petId) {
            localStorage.setItem(SELECTED_KEY, newPets.length > 0 ? newPets[0].id : '');
        }
        renderAll(newPets);
    };

    // ペット選択
    window.selectPet = function(petId) {
        localStorage.setItem(SELECTED_KEY, petId);
        const pets = JSON.parse(localStorage.getItem('uchinoko_pets') || '[]');
        renderAll(pets);
    };

    // 画面描画
    function renderAll(pets) {
        const lang = getLang();
        const t = i18n[lang];
        const selectedId = localStorage.getItem(SELECTED_KEY);
        const selector = document.getElementById('petSelector');
        selector.innerHTML = '';

        pets.forEach(pet => {
            const icon = pet.type === 'dog' ? '🐶' : '🐱';
            const div = document.createElement('div');
            div.className = 'pet-option' + (pet.id === selectedId ? ' active' : '');
            div.innerHTML = `${icon} ${pet.name}<button class="del-pet-btn" onclick="event.stopPropagation(); deletePet('${pet.id}')">×</button>`;
            div.onclick = () => selectPet(pet.id);
            selector.appendChild(div);
        });

        const menuArea = document.getElementById('menuArea');
        const selectedPet = pets.find(p => p.id === selectedId);

        if (!selectedPet) {
            // 最初のペットを自動選択
            if (pets.length > 0) {
                localStorage.setItem(SELECTED_KEY, pets[0].id);
                renderAll(pets);
                return;
            }
            menuArea.innerHTML = `<p class="no-pet-msg">${t.noPet}</p>`;
            return;
        }

        menuArea.innerHTML = `
            <div class="menu-container">
                <a href="diary.html" class="menu-item"><span class="icon">📖</span> ${t.menu.diary}</a>
                <a href="symptoms.html" class="menu-item"><span class="icon">🔍</span> ${t.menu.symptoms}</a>
                <a href="album.html" class="menu-item"><span class="icon">📸</span> ${t.menu.album}</a>
                <a href="blood.html" class="menu-item"><span class="icon">🏥</span> ${t.menu.blood}</a>
            </div>`;
    }
</script>
</body>
</html>
