<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うちの子 - 症状</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        body { background-color: #f5f5dc; font-family: sans-serif; padding: 20px; color: #000; }
        h1 { font-size: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .back-btn { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #000; font-weight: bold; }
        .pet-badge { display: inline-block; background: #adff2f; border: 1px solid #556b2f; border-radius: 10px; font-size: 12px; padding: 2px 8px; margin-bottom: 12px; font-weight: bold; }
        .setting-section { background: #fff; border: 2px solid #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .setting-section small { color: #555; }
        .word-input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #000; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .save-words-btn { background-color: #adff2f; border: 2px solid #000; padding: 15px; margin-top: 10px; cursor: pointer; border-radius: 10px; font-size: 18px; width: 100%; font-weight: bold; box-shadow: 2px 2px 0px #000; }
        .filter-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .filter-btn { background-color: #adff2f; border: 2px solid #000; border-radius: 10px; padding: 12px 15px; font-weight: bold; cursor: pointer; flex-grow: 1; text-align: center; font-size: 15px; }
        .filter-btn.active { background-color: #556b2f; color: #fff; }
        hr { border: none; border-top: 2px solid #000; margin: 10px 0 15px; }
        h2 { font-size: 16px; margin-bottom: 10px; }
        .result-item { background: #fff; border: 2px solid #000; border-left: 6px solid #adff2f; padding: 10px 12px; margin-bottom: 8px; border-radius: 5px; }
        .result-time { font-weight: bold; font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
        .result-text { font-size: 15px; white-space: pre-wrap; display: block; }
        .empty-msg { color: #666; font-style: italic; padding: 10px 0; }
        .loading-msg { color: #666; padding: 10px 0; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn" id="t-back"></a>
    <h1 id="t-title"></h1>
    <div id="petBadge" class="pet-badge"></div>

    <div class="setting-section">
        <small id="t-hint"></small>
        <div id="wordInputs">
            <input type="text" class="word-input" id="placeholder1">
            <input type="text" class="word-input" id="placeholder2">
            <input type="text" class="word-input" id="placeholder3">
            <input type="text" class="word-input" id="placeholder4">
            <input type="text" class="word-input" id="placeholder5">
        </div>
        <button class="save-words-btn" onclick="saveWords()" id="t-save-btn"></button>
    </div>

    <div id="filterButtons" class="filter-container"></div>
    <hr>
    <h2 id="currentKeywordTitle"></h2>
    <div id="filteredList"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOevKlIPTEu1pgZhyf_a-I2US5KbZQi2c",
            authDomain: "uchinoko-58fc7.firebaseapp.com",
            projectId: "uchinoko-58fc7",
            storageBucket: "uchinoko-58fc7.firebasestorage.app",
            messagingSenderId: "47451202211",
            appId: "1:47451202211:web:f205f797c3560f5c7c9516"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const i18n = {
            ja: {
                back: '← 戻る',
                title: '症状別・事実の抽出',
                hint: '気になる症状ワードを5つまで設定してください',
                saveBtn: 'ワードを更新する',
                badge: (name) => `${name}の症状記録`,
                noPet: '⚠️ ペットが選択されていません',
                placeholders: ['例：下痢', '例：口を気にする', '例：食欲なし', '例：嘔吐', '例：元気なし'],
                resultTitle: (word) => `「${word}」の記録`,
                loading: '読み込み中...',
                notFound: (word) => `「${word}」を含む記録は見つかりませんでした`,
                setWord: 'ワードを設定してください',
                tapHint: '上のボタンをタップすると日記から抽出します',
                saved: 'ワードを更新しました',
                saveError: '保存に失敗しました',
                loadError: '読み込みに失敗しました'
            },
            en: {
                back: '← Back',
                title: 'Symptom Search',
                hint: 'Set up to 5 symptom keywords to search',
                saveBtn: 'Update keywords',
                badge: (name) => `${name}'s symptoms`,
                noPet: '⚠️ No pet selected',
                placeholders: ['e.g. diarrhea', 'e.g. scratching', 'e.g. no appetite', 'e.g. vomiting', 'e.g. lethargic'],
                resultTitle: (word) => `Records with "${word}"`,
                loading: 'Loading...',
                notFound: (word) => `No records found with "${word}"`,
                setWord: 'Please set keywords first',
                tapHint: 'Tap a button above to search diary',
                saved: 'Keywords updated',
                saveError: 'Failed to save',
                loadError: 'Failed to load'
            },
            es: {
                back: '← Volver',
                title: 'Búsqueda de síntomas',
                hint: 'Configura hasta 5 palabras clave de síntomas',
                saveBtn: 'Actualizar palabras clave',
                badge: (name) => `Síntomas de ${name}`,
                noPet: '⚠️ No hay mascota seleccionada',
                placeholders: ['Ej: diarrea', 'Ej: rascado', 'Ej: sin apetito', 'Ej: vómito', 'Ej: sin energía'],
                resultTitle: (word) => `Registros con "${word}"`,
                loading: 'Cargando...',
                notFound: (word) => `No se encontraron registros con "${word}"`,
                setWord: 'Por favor configura palabras clave',
                tapHint: 'Toca un botón para buscar en el diario',
                saved: 'Palabras clave actualizadas',
                saveError: 'Error al guardar',
                loadError: 'Error al cargar'
            }
        };

        const lang = localStorage.getItem('uchinoko_lang') || 'ja';
        const t = i18n[lang];

        // テキスト適用
        document.getElementById('t-back').innerText = t.back;
        document.getElementById('t-title').innerText = t.title;
        document.getElementById('t-hint').innerText = t.hint;
        document.getElementById('t-save-btn').innerText = t.saveBtn;
        document.getElementById('currentKeywordTitle').innerText = t.tapHint;
        document.documentElement.lang = lang;

        // プレースホルダー設定
        t.placeholders.forEach((ph, i) => {
            const el = document.getElementById(`placeholder${i + 1}`);
            if (el) el.placeholder = ph;
        });

        // ペット情報取得
        function getSelectedPet() {
            try {
                const pets = JSON.parse(localStorage.getItem('uchinoko_pets')) || [];
                const selectedId = localStorage.getItem('uchinoko_selected_pet');
                return pets.find(p => p.id === selectedId) || null;
            } catch { return null; }
        }

        const pet = getSelectedPet();
        const petBadge = document.getElementById('petBadge');
        if (!pet) {
            petBadge.innerText = t.noPet;
        } else {
            const icon = pet.type === 'dog' ? '🐶' : '🐱';
            petBadge.innerText = `${icon} ${t.badge(pet.name)}`;
        }

        const wordsDocId = pet ? `symptom_words_${pet.id}` : 'symptom_words';

        window.onload = function() { loadWords(); };

        window.saveWords = async function() {
            const inputs = document.querySelectorAll('.word-input');
            const words = Array.from(inputs).map(i => i.value.trim()).filter(w => w !== "");
            try {
                await setDoc(doc(db, "settings", wordsDocId), { words });
                alert(t.saved);
                loadWords();
            } catch(e) { alert(t.saveError); }
        };

        async function loadWords() {
            try {
                const snap = await getDoc(doc(db, "settings", wordsDocId));
                const words = snap.exists() ? snap.data().words :
                    (await getDoc(doc(db, "settings", "symptom_words"))).data()?.words || [];

                const inputs = document.querySelectorAll('.word-input');
                inputs.forEach((input, i) => { input.value = words[i] || ""; });

                const btnContainer = document.getElementById('filterButtons');
                btnContainer.innerHTML = "";
                if (words.length === 0) {
                    btnContainer.innerHTML = `<p style='color:#666;'>${t.setWord}</p>`;
                    return;
                }
                words.forEach(word => {
                    const btn = document.createElement('button');
                    btn.className = "filter-btn";
                    btn.textContent = word;
                    btn.onclick = () => filterByWord(word, btn);
                    btnContainer.appendChild(btn);
                });
            } catch(e) { console.error(e); }
        }

        async function filterByWord(word, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('currentKeywordTitle').textContent = t.resultTitle(word);
            const listDiv = document.getElementById('filteredList');
            listDiv.innerHTML = `<p class='loading-msg'>${t.loading}</p>`;

            try {
                const q = query(collection(db, "pet_diary"), orderBy("time", "desc"));
                const snapshot = await getDocs(q);
                const results = [];
                snapshot.forEach(d => {
                    const data = d.data();
                    if (data.petId && pet && data.petId !== pet.id) return;
                    if (data.text && data.text.includes(word)) results.push(data);
                });

                listDiv.innerHTML = "";
                if (results.length === 0) {
                    listDiv.innerHTML = `<p class="empty-msg">${t.notFound(word)}</p>`;
                    return;
                }
                results.forEach(data => {
                    const item = document.createElement('div');
                    item.className = "result-item";
                    const timeStr = (data.time || "").replace('T', ' ');
                    item.innerHTML = `
                        <span class="result-time">${timeStr}</span>
                        <span class="result-text">${data.text}</span>`;
                    listDiv.appendChild(item);
                });
            } catch(e) {
                listDiv.innerHTML = `<p class="empty-msg">${t.loadError}</p>`;
            }
        }
    </script>
</body>
</html>
