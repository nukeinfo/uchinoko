    <style>

        h1 { font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 10px; }

        .pet-badge { display: inline-block; background: #adff2f; border: 1px solid #556b2f; border-radius: 10px; font-size: 12px; padding: 2px 8px; margin-bottom: 12px; font-weight: bold; }
        .ocr-box { background: #e0f7fa; border: 2px dashed #00796b; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; width: 100%; }
        #status { font-size: 12px; color: #00796b; margin-top: 8px; font-weight: bold; }
        .test-group { background: #fff; border: 2px solid #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; width: 100%; }
        .group-title { font-weight: bold; border-left: 5px solid #adff2f; padding-left: 10px; margin-bottom: 12px; background: #fafafa; font-size: 14px; border-bottom: 1px solid #ddd; }
        .test-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .test-label { font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: underline; color: #000; display: inline-block; padding: 2px 0; flex: 1; margin-right: 8px; word-break: break-all; }
        .test-input { width: 90px; min-width: 0; flex-shrink: 0; padding: 6px; border: 2px solid #000; border-radius: 5px; text-align: center; font-size: 15px; box-sizing: border-box; }
        #dictBox { position: fixed; bottom: 0; left: 0; right: 0; background: #fffbe6; border-top: 3px solid #000; padding: 15px; display: none; z-index: 1000; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); max-height: 45vh; overflow-y: auto; }
        .close-dict { float: right; cursor: pointer; font-weight: bold; font-size: 28px; padding: 0 10px; line-height: 1; }
        .save-btn { -webkit-appearance: none; background-color: #adff2f; border: 2px solid #000; border-radius: 10px; color: #000; font-weight: bold; width: 100%; padding: 15px; font-size: 18px; cursor: pointer; box-shadow: 3px 3px 0px #000; margin-top: 10px; box-sizing: border-box; }

    window.showDict = function(item) {
        const box = document.getElementById('dictBox');
        document.getElementById('dictTitle').innerText = item;
        document.getElementById('dictContent').innerText =
            dicts[petType][lang][item] || dicts[petType]['en'][item] || '';
        box.style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    };

    window.closeDict = function() { document.getElementById('dictBox').style.display = 'none'; };

    let selectedFiles = [];

    function addFiles(files) {
        for (const file of files) {
            selectedFiles.push(file);
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.style.cssText = 'width:70px; height:70px; object-fit:cover; border:2px solid #000; border-radius:5px;';
            document.getElementById('previewArea').appendChild(img);
        }
        document.getElementById('ocrBtn').style.display = selectedFiles.length > 0 ? 'block' : 'none';
    }

    document.getElementById('ocr-camera').addEventListener('change', e => addFiles(e.target.files));
    document.getElementById('ocr-gallery').addEventListener('change', e => addFiles(e.target.files));

    window.runOCR = async function() {
        if (selectedFiles.length === 0) return;
        const statusEl = document.getElementById('status');
        statusEl.innerText = t.ocrLoading;
        document.getElementById('ocrBtn').disabled = true;
        try {
            let found = 0;
            for (const file of selectedFiles) {
                const base64 = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
                const response = await fetch('https://chimerical-cheesecake-ef22ef.netlify.app/.netlify/functions/ocr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64: base64, mediaType: file.type || 'image/jpeg' })
                });
                const result = await response.json();
                if (result.success && result.values) {
                    for (const [key, val] of Object.entries(result.values)) {
                        const el = document.getElementById('val' + key);
                        if (el && val) { el.value = val; found++; }
                    }
                }
            }
            statusEl.innerText = t.ocrDone(found);
        } catch(e) {
            statusEl.innerText = t.ocrFail;
        }
        document.getElementById('ocrBtn').disabled = false;
    };

    window.saveTest = async function() {
        const testDate = document.getElementById('testDate').value;
        if (!testDate) return alert(t.errorDate);
        if (!pet) return alert(t.errorNoPet);
        const data = { testDate, petType, petId: pet.id, petName: pet.name, timestamp: new Date() };
        ['RBC','HCT','HGB','MCV','MCH','MCHC','RDW','PRET','RET','RETICHGB',
         'WBC','NEU','LYM','MON','EOS','BAS','NEUN','LYMN','MONN','EOSN','BASN',
         'PLT','MPV','PCT'].forEach(id => { data[id] = document.getElementById('val' + id).value; });
        try {
            await addDoc(collection(db, "blood_tests"), data);
            alert(t.saved);
        } catch(e) { alert(t.errorSave); }
    };
