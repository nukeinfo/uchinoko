<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>うちの子 - 日記</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        body { background-color: #f5f5dc; font-family: sans-serif; padding: 15px; color: #000; }
        h1 { font-size: 1.1rem; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 15px; }
        .input-section { background: #fff; border: 2px solid #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #000; border-radius: 5px; box-sizing: border-box; margin-top: 5px; display: block; -webkit-appearance: none; appearance: none; }
        input[type="datetime-local"] { width: 100%; max-width: 100%; overflow: hidden; }
        .save-btn { -webkit-appearance: none; background-color: #adff2f; border: 2px solid #000; border-radius: 10px; font-weight: bold; width: 100%; padding: 15px; margin-top: 15px; font-size: 1.1rem; cursor: pointer; box-shadow: 2px 2px 0px #000; display: block; box-sizing: border-box; }
        .log-item { background: #fff; border: 2px solid #000; border-left: 8px solid #adff2f; padding: 12px; margin-bottom: 12px; }
        .log-date-line { font-weight: bold; color: #000; font-size: 15px; display: block; margin-bottom: 5px; }
        .log-content-line { white-space: pre-wrap; font-size: 15px; display: block; color: #000; line-height: 1.5; }
        .action-btns { text-align: right; margin-top: 10px; }
        .edit-btn, .del-btn { border: 1px solid #000; border-radius: 5px; padding: 8px 12px; font-size: 13px; cursor: pointer; margin-left: 10px; font-weight: bold; background: #fff; }
        .pet-badge { display: inline-block; background: #adff2f; border: 1px solid #556b2f; border-radius: 10px; font-size: 12px; padding: 2px 8px; margin-bottom: 8px; font-weight: bold; }
        .back-btn { font-weight: bold; text-decoration: none; color: #000; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn" id="t-back"></a>
    <h1 id="t-title"></h1>
    <div class="input-section">
        <div id="petBadge" class="pet-badge"></div>
        <label id="t-time-label"></label>
        <input type="datetime-local" id="logTime">
        <label id="t-event-label"></label>
        <textarea id="logText"></textarea>
        <button id="mainBtn" class="save-btn"></button>
    </div>
    <div id="diaryList"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, updateDoc, deleteDoc, doc, Timestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOevKlIPTEu1pgZhyf_a-I2US5KbZQi2c",
            authDomain: "uchinoko-58fc7.firebaseapp.com",
            projectId: "uchinoko-58fc7",
            storageBucket: "uchinoko-58fc7.firebasestorage.app",
            messagingSenderId: "47451202211",
            appId: "1:47451202211:web:f205f797c3560f5c7c9516"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const i18n = {
            ja: {
                back: '← 戻る', title: '日々の記録（日記）', timeLabel: '日時',
                eventLabel: 'できごと', placeholder: '例：ごはんを完食した。',
                saveBtn: '記録を保存する', updateBtn: '修正を反映する',
                editBtn: '修正', delBtn: '削除',
                badge: (name) => `${name}の日記`,
                noPet: '⚠️ ペットが選択されていません',
                confirmDelete: '削除しますか？', errorEmpty: '内容を入力してください',
                errorNoPet: 'ペットを選択してください', errorSave: 'エラーが発生しました',
                empty: 'まだ記録がありません'
            },
            en: {
                back: '← Back', title: 'Daily Diary', timeLabel: 'Date & Time',
                eventLabel: 'What happened', placeholder: 'e.g. Finished all the food today!',
                saveBtn: 'Save record', updateBtn: 'Update record',
                editBtn: 'Edit', delBtn: 'Delete',
                badge: (name) => `${name}'s diary`,
                noPet: '⚠️ No pet selected',
                confirmDelete: 'Delete this record?', errorEmpty: 'Please enter some content',
                errorNoPet: 'Please select a pet', errorSave: 'An error occurred',
                empty: 'No records yet'
            },
            es: {
                back: '← Volver', title: 'Diario', timeLabel: 'Fecha y hora',
                eventLabel: '¿Qué pasó?', placeholder: 'Ej: Comió todo su alimento hoy.',
                saveBtn: 'Guardar registro', updateBtn: 'Actualizar registro',
                editBtn: 'Editar', delBtn: 'Eliminar',
                badge: (name) => `Diario de ${name}`,
                noPet: '⚠️ No hay mascota seleccionada',
                confirmDelete: '¿Eliminar este registro?', errorEmpty: 'Por favor ingresa contenido',
                errorNoPet: 'Por favor selecciona una mascota', errorSave: 'Ocurrió un error',
                empty: 'Aún no hay registros'
            }
        };

        const lang = localStorage.getItem('uchinoko_lang') || 'ja';
        const t = i18n[lang];
        document.documentElement.lang = lang;

        document.getElementById('t-back').innerText = t.back;
        document.getElementById('t-title').innerText = t.title;
        document.getElementById('t-time-label').innerText = t.timeLabel;
        document.getElementById('t-event-label').innerText = t.eventLabel;
        document.getElementById('logText').placeholder = t.placeholder;
        document.getElementById('mainBtn').innerText = t.saveBtn;

        function getSelectedPet() {
            try {
                const pets = JSON.parse(localStorage.getItem('uchinoko_pets')) || [];
                const selectedId = localStorage.getItem('uchinoko_selected_pet');
                return pets.find(p => p.id === selectedId) || null;
            } catch { return null; }
        }

        const pet = getSelectedPet();
        if (!pet) {
            document.getElementById('petBadge').innerText = t.noPet;
        } else {
            const icon = pet.type === 'dog' ? '🐶' : '🐱';
            document.getElementById('petBadge').innerText = `${icon} ${t.badge(pet.name)}`;
        }

        const mainBtn = document.getElementById('mainBtn');
        const textInput = document.getElementById('logText');
        const timeInput = document.getElementById('logTime');
        let editId = null;

        function resetUI() {
            textInput.value = "";
            mainBtn.innerText = t.saveBtn;
            editId = null;
            const now = new Date();
            const jst = new Date(now.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }));
            const y = jst.getFullYear();
            const m = String(jst.getMonth() + 1).padStart(2, '0');
            const d = String(jst.getDate()).padStart(2, '0');
            const h = String(jst.getHours()).padStart(2, '0');
            const min = String(jst.getMinutes()).padStart(2, '0');
            timeInput.value = `${y}-${m}-${d}T${h}:${min}`;
        }

        mainBtn.addEventListener('click', async () => {
            if (!textInput.value) return alert(t.errorEmpty);
            if (!pet) return alert(t.errorNoPet);
            try {
                const data = { time: timeInput.value, text: textInput.value, petId: pet.id, petName: pet.name };
                if (editId) {
                    await updateDoc(doc(db, "pet_diary", editId), data);
                } else {
                    await addDoc(collection(db, "pet_diary"), { ...data, timestamp: Timestamp.now() });
                }
                resetUI();
            } catch(e) { alert(t.errorSave); }
        });

        function loadDiary() {
            const q = query(collection(db, "pet_diary"), orderBy("time", "desc"));
            onSnapshot(q, (snapshot) => {
                const listDiv = document.getElementById('diaryList');
                listDiv.innerHTML = "";
                let count = 0;
                snapshot.forEach((d) => {
                    const data = d.data();
                    if (data.petId && pet && data.petId !== pet.id) return;
                    count++;
                    const id = d.id;
                    const item = document.createElement('div');
                    item.className = "log-item";
                    const timeStr = (data.time || "").replace('T', ' ');
                    item.innerHTML = `
                        <span class="log-date-line">${timeStr}</span>
                        <span class="log-content-line">${data.text || ""}</span>
                        <div class="action-btns">
                            <button class="edit-btn">${t.editBtn}</button>
                            <button class="del-btn">${t.delBtn}</button>
                        </div>`;
                    item.querySelector('.edit-btn').onclick = () => {
                        timeInput.value = data.time || "";
                        textInput.value = data.text || "";
                        editId = id;
                        mainBtn.innerText = t.updateBtn;
                        window.scrollTo(0, 0);
                    };
                    item.querySelector('.del-btn').onclick = async () => {
                        if (confirm(t.confirmDelete)) await deleteDoc(doc(db, "pet_diary", id));
                    };
                    listDiv.appendChild(item);
                });
                if (count === 0) {
                    listDiv.innerHTML = `<p style="text-align:center; color:#888;">${t.empty}</p>`;
                }
            });
        }

        loadDiary();
        resetUI();
    </script>
    <div style="text-align:center; margin-top:20px; padding-bottom:20px;">
        <span style="display:block; color:#888; font-size:13px; font-weight:bold;">© T.K.C.</span>
        <small style="color:#666; font-size:10px; letter-spacing:0.5px;">True Kind Care for all the loved ones</small>
    </div>
</body>
</html>
