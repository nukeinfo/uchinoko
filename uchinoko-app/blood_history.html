<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血液検査履歴 - うちの子記録</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        body { background-color: #f5f5dc; font-family: sans-serif; padding: 20px; color: #000; padding-bottom: 40px; }
        .container { max-width: 500px; margin: 0 auto; width: 100%; }
        h1 { font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .back-btn { display: inline-block; margin: 10px 0; text-decoration: none; color: #000; font-weight: bold; }
        .date-btn { display: block; width: 100%; background: #fff; border: 2px solid #000; border-radius: 10px; padding: 15px 20px; margin-bottom: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: left; box-shadow: 3px 3px 0px #000; }
        .detail-box { display: none; background: #fff; border: 2px solid #000; border-radius: 10px; padding: 15px; margin-bottom: 16px; }
        .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-weight: bold; color: #333; }
        .detail-value { color: #000; }
        .no-data { text-align: center; color: #888; margin-top: 40px; font-size: 15px; }
        .group-title { font-weight: bold; border-left: 5px solid #adff2f; padding-left: 10px; margin: 12px 0 6px; font-size: 13px; color: #555; }
        .delete-btn { display: block; width: 100%; background: #fff; border: 2px solid #ff4444; border-radius: 8px; padding: 10px; margin-top: 12px; font-size: 14px; font-weight: bold; color: #ff4444; cursor: pointer; text-align: center; }
        .delete-btn:active { background: #fff0f0; }
    </style>
</head>
<body>
<div class="container">
    <a href="blood.html" class="back-btn">← 戻る</a>
    <h1 id="page-title">📋 血液検査履歴</h1>
    <div id="list"><p style="text-align:center; color:#888;">読み込み中...</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
    var firebaseConfig = {
        apiKey: "AIzaSyAOevKlIPTEu1pgZhyf_a-I2US5KbZQi2c",
        authDomain: "uchinoko-58fc7.firebaseapp.com",
        projectId: "uchinoko-58fc7",
        storageBucket: "uchinoko-58fc7.firebasestorage.app",
        messagingSenderId: "47451202211",
        appId: "1:47451202211:web:f205f797c3560f5c7c9516"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    var petType = localStorage.getItem('selected_pet_type') || 'cat';
    var icon = petType === 'dog' ? '🐶' : '🐱';
    document.getElementById('page-title').innerText = icon + ' 📋 血液検査履歴';

    var labels = {
        RBC: 'RBC (赤血球数)', HCT: 'HCT (ヘマトクリット)', HGB: 'HGB (ヘモグロビン)',
        RET: 'RET (網状赤血球数)', NRBC: '有核赤血球 (nRBC)', WBC: 'WBC (白血球計)',
        NEU: 'Neu (好中球)', LYM: 'Lym (リンパ球)', MON: 'Mon (単球)',
        EOS: 'Eos (好酸球)', BAS: 'Bas (好塩基球)', PLT: 'PLT (血小板数)',
        MPV: 'MPV (平均血小板容積)', PCT: 'PCT (血小板クリット)'
    };

    var groups = {
        '赤血球系（貧血の評価）': ['RBC','HCT','HGB','RET','NRBC'],
        '白血球系内訳': ['WBC','NEU','LYM','MON','EOS','BAS'],
        '血小板（止血）': ['PLT','MPV','PCT']
    };

    function loadList() {
        db.collection('blood_tests').get().then(function(snapshot) {
            var listEl = document.getElementById('list');
            var docs = [];
            snapshot.forEach(function(doc) {
                docs.push({ id: doc.id, d: doc.data() });
            });

            docs.sort(function(a, b) {
                return a.d.testDate < b.d.testDate ? 1 : -1;
            });

            var filtered = docs.filter(function(item) {
                return !item.d.petType || item.d.petType === petType;
            });

            listEl.innerHTML = '';

            if (filtered.length === 0) {
                listEl.innerHTML = '<p class="no-data">まだ記録がありません</p>';
                return;
            }

            filtered.forEach(function(item) {
                var id = item.id;
                var d = item.d;
                var btnId = 'detail_' + id;

                var btn = document.createElement('button');
                btn.className = 'date-btn';
                btn.innerText = '📅 ' + d.testDate;
                btn.onclick = function() {
                    var box = document.getElementById(btnId);
                    box.style.display = box.style.display === 'block' ? 'none' : 'block';
                };

                var box = document.createElement('div');
                box.className = 'detail-box';
                box.id = btnId;

                Object.keys(groups).forEach(function(groupName) {
                    var keys = groups[groupName];
                    var hasData = keys.some(function(k) { return d[k]; });
                    if (!hasData) return;

                    var gt = document.createElement('div');
                    gt.className = 'group-title';
                    gt.innerText = groupName;
                    box.appendChild(gt);

                    keys.forEach(function(key) {
                        if (!d[key]) return;
                        var row = document.createElement('div');
                        row.className = 'detail-row';
                        row.innerHTML = '<span class="detail-label">' + labels[key] + '</span><span class="detail-value">' + d[key] + '</span>';
                        box.appendChild(row);
                    });
                });

                // 削除ボタン
                var delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerText = '🗑 この記録を削除する';
                delBtn.onclick = function() {
                    if (confirm(d.testDate + ' の記録を削除しますか？')) {
                        db.collection('blood_tests').doc(id).delete().then(function() {
                            loadList();
                        }).catch(function(e) {
                            alert('削除に失敗しました: ' + e.message);
                        });
                    }
                };
                box.appendChild(delBtn);

                listEl.appendChild(btn);
                listEl.appendChild(box);
            });

        }).catch(function(e) {
            document.getElementById('list').innerHTML = '<p class="no-data">読み込みに失敗しました<br><small>' + e.message + '</small></p>';
            console.error(e);
        });
    }

    loadList();
</script>
</body>
</html>
