<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>うちの子 - 血液検査履歴</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        body { background-color: #f5f5dc; font-family: sans-serif; padding: 20px; color: #000; padding-bottom: 40px; }
        .container { max-width: 500px; margin: 0 auto; width: 100%; }
        h1 { font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .back-btn { display: inline-block; margin: 10px 0; text-decoration: none; color: #000; font-weight: bold; }
        .pet-badge { display: inline-block; background: #adff2f; border: 1px solid #556b2f; border-radius: 10px; font-size: 12px; padding: 2px 8px; margin-bottom: 12px; font-weight: bold; }
        .date-btn { display: block; width: 100%; background: #fff; border: 2px solid #000; border-radius: 10px; padding: 15px 20px; margin-bottom: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: left; box-shadow: 3px 3px 0px #000; }
        .detail-box { display: none; background: #fff; border: 2px solid #000; border-radius: 10px; padding: 15px; margin-bottom: 16px; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-weight: bold; color: #333; flex: 1; }
        .detail-value { color: #000; min-width: 80px; text-align: right; cursor: pointer; padding: 4px 8px; border-radius: 5px; }
        .detail-value:hover { background: #f0f0f0; }
        .detail-input { width: 90px; padding: 4px 6px; border: 2px solid #00796b; border-radius: 5px; text-align: center; font-size: 14px; display: none; }
        .no-data { text-align: center; color: #888; margin-top: 40px; font-size: 15px; }
        .group-title { font-weight: bold; border-left: 5px solid #adff2f; padding-left: 10px; margin: 12px 0 6px; font-size: 13px; color: #555; }
        .save-btn { display: none; width: 100%; background: #adff2f; border: 2px solid #000; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 15px; font-weight: bold; color: #000; cursor: pointer; text-align: center; box-shadow: 2px 2px 0px #000; }
        .delete-btn { display: block; width: 100%; background: #fff; border: 2px solid #ff4444; border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 14px; font-weight: bold; color: #ff4444; cursor: pointer; text-align: center; }
        .edit-hint { font-size: 11px; color: #888; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container">
    <a href="blood.html" class="back-btn" id="t-back"></a>
    <div id="petBadge" class="pet-badge"></div>
    <h1 id="t-title"></h1>
    <div id="list"><p style="text-align:center; color:#888;" id="t-loading"></p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
    var firebaseConfig = {
        apiKey: "AIzaSyAOevKlIPTEu1pgZhyf_a-I2US5KbZQi2c",
        authDomain: "uchinoko-58fc7.firebaseapp.com",
        projectId: "uchinoko-58fc7",
        storageBucket: "uchinoko-58fc7.firebasestorage.app",
        messagingSenderId: "47451202211",
        appId: "1:47451202211:web:f205f797c3560f5c7c9516"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    var lang = localStorage.getItem('uchinoko_lang') || 'ja';
    document.documentElement.lang = lang;

    var i18n = {
        ja: {
            back: '← 戻る', title: '📋 血液検査履歴',
            loading: '読み込み中...', noData: 'まだ記録がありません',
            loadError: '読み込みに失敗しました',
            editHint: '✏️ 数値をタップすると編集できます',
            saveBtn: '💾 修正を保存する', deleteBtn: '🗑 この記録を削除する',
            confirmDelete: function(date) { return date + ' の記録を削除しますか？'; },
            saved: '保存しました！',
            saveError: function(msg) { return '保存に失敗しました: ' + msg; },
            deleteError: function(msg) { return '削除に失敗しました: ' + msg; },
            badge: function(name) { return name + 'の血液検査履歴'; },
            group1: '赤血球系（貧血の評価）',
            group2: '白血球系（免疫の評価）',
            group3: '血小板（止血）',
            labels: {
                RBC:'赤血球数(RBC)', HCT:'ヘマトクリット(HCT)', HGB:'ヘモグロビン濃度(HGB)',
                MCV:'平均赤血球容積(MCV)', MCH:'平均赤血球ヘモグロビン量(MCH)',
                MCHC:'平均赤血球ヘモグロビン濃度(MCHC)', RDW:'赤血球分布幅',
                PRET:'%網状赤血球', RET:'網状赤血球数(RET)', RETICHGB:'網状赤血球ヘモグロビン(RETIC-HGB)',
                WBC:'白血球数(WBC)', NEU:'好中球%(Neu)', LYM:'リンパ球%(Lym)',
                MON:'単球%(Mon)', EOS:'好酸球%(Eos)', BAS:'好塩基球%(Bas)',
                NEUN:'好中球数(Neu)', LYMN:'リンパ球数(Lym)', MONN:'単球数(Mon)',
                EOSN:'好酸球数(Eos)', BASN:'好塩基球数(Bas)',
                PLT:'血小板(PLT)', MPV:'平均血小板容積(MPV)', PCT:'血小板クリット(PCT)'
            }
        },
        en: {
            back: '← Back', title: '📋 Blood Test History',
            loading: 'Loading...', noData: 'No records yet',
            loadError: 'Failed to load records',
            editHint: '✏️ Tap a value to edit it',
            saveBtn: '💾 Save changes', deleteBtn: '🗑 Delete this record',
            confirmDelete: function(date) { return 'Delete record from ' + date + '?'; },
            saved: 'Saved!',
            saveError: function(msg) { return 'Failed to save: ' + msg; },
            deleteError: function(msg) { return 'Failed to delete: ' + msg; },
            badge: function(name) { return name + "'s blood test history"; },
            group1: 'Red Blood Cells (Anemia)',
            group2: 'White Blood Cells (Immunity)',
            group3: 'Platelets (Clotting)',
            labels: {
                RBC:'Red Blood Cell Count (RBC)', HCT:'Hematocrit (HCT)', HGB:'Hemoglobin (HGB)',
                MCV:'Mean Corpuscular Volume (MCV)', MCH:'Mean Corpuscular Hemoglobin (MCH)',
                MCHC:'MCHC', RDW:'Red Cell Distribution Width (RDW)',
                PRET:'% Reticulocytes', RET:'Reticulocyte Count (RET)', RETICHGB:'Reticulocyte Hemoglobin',
                WBC:'White Blood Cell Count (WBC)', NEU:'Neutrophils % (Neu)', LYM:'Lymphocytes % (Lym)',
                MON:'Monocytes % (Mon)', EOS:'Eosinophils % (Eos)', BAS:'Basophils % (Bas)',
                NEUN:'Neutrophil Count (Neu)', LYMN:'Lymphocyte Count (Lym)', MONN:'Monocyte Count (Mon)',
                EOSN:'Eosinophil Count (Eos)', BASN:'Basophil Count (Bas)',
                PLT:'Platelets (PLT)', MPV:'Mean Platelet Volume (MPV)', PCT:'Plateletcrit (PCT)'
            }
        },
        es: {
            back: '← Volver', title: '📋 Historial de Análisis de Sangre',
            loading: 'Cargando...', noData: 'Aún no hay registros',
            loadError: 'Error al cargar registros',
            editHint: '✏️ Toca un valor para editarlo',
            saveBtn: '💾 Guardar cambios', deleteBtn: '🗑 Eliminar este registro',
            confirmDelete: function(date) { return '¿Eliminar registro del ' + date + '?'; },
            saved: '¡Guardado!',
            saveError: function(msg) { return 'Error al guardar: ' + msg; },
            deleteError: function(msg) { return 'Error al eliminar: ' + msg; },
            badge: function(name) { return 'Historial de ' + name; },
            group1: 'Glóbulos Rojos (Anemia)',
            group2: 'Glóbulos Blancos (Inmunidad)',
            group3: 'Plaquetas (Coagulación)',
            labels: {
                RBC:'Glóbulos Rojos (RBC)', HCT:'Hematocrito (HCT)', HGB:'Hemoglobina (HGB)',
                MCV:'Volumen Corpuscular Medio (MCV)', MCH:'HCM', MCHC:'CHCM',
                RDW:'Amplitud de Distribución Eritrocitaria (RDW)',
                PRET:'% Reticulocitos', RET:'Recuento de Reticulocitos', RETICHGB:'Hemoglobina de Reticulocitos',
                WBC:'Glóbulos Blancos (WBC)', NEU:'Neutrófilos % (Neu)', LYM:'Linfocitos % (Lym)',
                MON:'Monocitos % (Mon)', EOS:'Eosinófilos % (Eos)', BAS:'Basófilos % (Bas)',
                NEUN:'Recuento de Neutrófilos', LYMN:'Recuento de Linfocitos', MONN:'Recuento de Monocitos',
                EOSN:'Recuento de Eosinófilos', BASN:'Recuento de Basófilos',
                PLT:'Plaquetas (PLT)', MPV:'Volumen Plaquetario Medio (MPV)', PCT:'Plaquetocrito (PCT)'
            }
        }
    };

    var t = i18n[lang];

    function getSelectedPet() {
        try {
            var pets = JSON.parse(localStorage.getItem('uchinoko_pets')) || [];
            var selectedId = localStorage.getItem('uchinoko_selected_pet');
            return pets.find(function(p) { return p.id === selectedId; }) || null;
        } catch(e) { return null; }
    }

    var pet = getSelectedPet();
    var petType = pet ? pet.type : (localStorage.getItem('selected_pet_type') || 'cat');
    var icon = petType === 'dog' ? '🐶' : '🐱';

    document.getElementById('t-back').innerText = t.back;
    document.getElementById('t-title').innerText = t.title;
    document.getElementById('t-loading').innerText = t.loading;
    document.getElementById('petBadge').innerText = pet ? (icon + ' ' + t.badge(pet.name)) : (icon + ' ' + t.title);

    var groups = {
        0: { name: t.group1, keys: ['RBC','HCT','HGB','MCV','MCH','MCHC','RDW','PRET','RET','RETICHGB'] },
        1: { name: t.group2, keys: ['WBC','NEU','LYM','MON','EOS','BAS','NEUN','LYMN','MONN','EOSN','BASN'] },
        2: { name: t.group3, keys: ['PLT','MPV','PCT'] }
    };

    var allKeys = ['RBC','HCT','HGB','MCV','MCH','MCHC','RDW','PRET','RET','RETICHGB',
                   'WBC','NEU','LYM','MON','EOS','BAS','NEUN','LYMN','MONN','EOSN','BASN',
                   'PLT','MPV','PCT'];

    function loadList() {
        db.collection('blood_tests').get().then(function(snapshot) {
            var listEl = document.getElementById('list');
            var docs = [];
            snapshot.forEach(function(doc) {
                docs.push({ id: doc.id, d: doc.data() });
            });

            docs.sort(function(a, b) {
                return a.d.testDate < b.d.testDate ? 1 : -1;
            });

            var filtered = docs.filter(function(item) {
                if (pet && item.d.petId) return item.d.petId === pet.id;
                return !item.d.petId && (!item.d.petType || item.d.petType === petType);
            });

            listEl.innerHTML = '';

            if (filtered.length === 0) {
                listEl.innerHTML = '<p class="no-data">' + t.noData + '</p>';
                return;
            }

            filtered.forEach(function(item) {
                var id = item.id;
                var d = item.d;
                var btnId = 'detail_' + id;
                var saveBtnId = 'save_' + id;

                var btn = document.createElement('button');
                btn.className = 'date-btn';
                btn.innerText = '📅 ' + d.testDate;
                btn.onclick = function() {
                    var box = document.getElementById(btnId);
                    box.style.display = box.style.display === 'block' ? 'none' : 'block';
                };

                var box = document.createElement('div');
                box.className = 'detail-box';
                box.id = btnId;

                var hint = document.createElement('p');
                hint.className = 'edit-hint';
                hint.innerText = t.editHint;
                box.appendChild(hint);

                Object.keys(groups).forEach(function(gi) {
                    var grp = groups[gi];
                    var hasData = grp.keys.some(function(k) { return d[k] || d[k] === 0; });
                    if (!hasData) return;

                    var gt = document.createElement('div');
                    gt.className = 'group-title';
                    gt.innerText = grp.name;
                    box.appendChild(gt);

                    grp.keys.forEach(function(key) {
                        if (!d[key] && d[key] !== 0) return;
                        var row = document.createElement('div');
                        row.className = 'detail-row';
                        var label = document.createElement('span');
                        label.className = 'detail-label';
                        label.innerText = t.labels[key] || key;
                        var valueSpan = document.createElement('span');
                        valueSpan.className = 'detail-value';
                        valueSpan.innerText = d[key];
                        valueSpan.id = 'val_' + id + '_' + key;
                        var input = document.createElement('input');
                        input.type = 'number';
                        input.className = 'detail-input';
                        input.value = d[key];
                        input.id = 'inp_' + id + '_' + key;
                        input.step = '0.01';
                        valueSpan.onclick = function() {
                            valueSpan.style.display = 'none';
                            input.style.display = 'inline-block';
                            input.focus();
                            document.getElementById(saveBtnId).style.display = 'block';
                        };
                        input.onblur = function() {
                            var newVal = input.value;
                            if (newVal !== '') valueSpan.innerText = newVal;
                            valueSpan.style.display = 'inline-block';
                            input.style.display = 'none';
                        };
                        row.appendChild(label);
                        row.appendChild(valueSpan);
                        row.appendChild(input);
                        box.appendChild(row);
                    });
                });

                var saveBtn = document.createElement('button');
                saveBtn.className = 'save-btn';
                saveBtn.id = saveBtnId;
                saveBtn.innerText = t.saveBtn;
                saveBtn.onclick = function() {
                    var updateData = {};
                    allKeys.forEach(function(key) {
                        var inp = document.getElementById('inp_' + id + '_' + key);
                        var val = document.getElementById('val_' + id + '_' + key);
                        if (inp) updateData[key] = inp.value || (val ? val.innerText : '');
                        else if (d[key]) updateData[key] = d[key];
                    });
                    db.collection('blood_tests').doc(id).update(updateData).then(function() {
                        alert(t.saved);
                        saveBtn.style.display = 'none';
                        loadList();
                    }).catch(function(e) {
                        alert(t.saveError(e.message));
                    });
                };
                box.appendChild(saveBtn);

                var delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerText = t.deleteBtn;
                delBtn.onclick = function() {
                    if (confirm(t.confirmDelete(d.testDate))) {
                        db.collection('blood_tests').doc(id).delete().then(function() {
                            loadList();
                        }).catch(function(e) {
                            alert(t.deleteError(e.message));
                        });
                    }
                };
                box.appendChild(delBtn);

                listEl.appendChild(btn);
                listEl.appendChild(box);
            });

        }).catch(function(e) {
            document.getElementById('list').innerHTML =
                '<p class="no-data">' + t.loadError + '<br><small>' + e.message + '</small></p>';
        });
    }

    loadList();
</script>
    <div style="text-align:center; margin-top:20px; padding-bottom:20px;">
        <span style="display:block; color:#888; font-size:13px; font-weight:bold;">© T.K.C.</span>
        <small style="color:#666; font-size:10px; letter-spacing:0.5px;">True Kind Care for all the loved ones</small>
    </div>
</body>
</html>
